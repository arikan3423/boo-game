
<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BOO! - Haunted Forest</title>

    <!-- CSS bağlantısı -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <!-- Oyun başlığı -->
        <h1>BOO!</h1>

        <!-- Oyun ekranı -->
        <div class="game-wrapper">

            <canvas
                id="gameCanvas"
                width="960"
                height="540">
            </canvas>

        </div>

        <!-- Kontrol bilgileri -->
        <div class="game-controls">

            <p>
                Press SPACE or TAP to fly!
            </p>

        </div>

    </main>

    <!-- JavaScript bağlantısı -->
    <script src="game.js"></script>

</body>
</html>
